services:
  backend:
    build: ./backend
    container_name: ict-backend
    ports:
      - "8083:8083"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ict-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
