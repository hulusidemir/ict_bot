services:
  backend:
    build: ./backend
    container_name: ict-backend
    ports:
      - "${BACKEND_PORT:-8083}:8083"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ict-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
